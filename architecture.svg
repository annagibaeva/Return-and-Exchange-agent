<!-- labels -->
<g font-size="8.5" fill="#475569">
<text x="188" y="128" text-anchor="middle">message</text>
<text x="448" y="228" >messages + identity</text>
<text x="543" y="427" text-anchor="middle">yes — call tool</text>
<text x="620" y="322" >result · loop ≤ 8 turns</text>
<text x="358" y="420" text-anchor="end" fill="#b07414">8 turns, no final text</text>
<text x="448" y="516" >no — draft ready</text>
<text x="308" y="592" text-anchor="middle">canned draft, still supervised</text>
