<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1040" width="100%" role="img" aria-label="End-to-end flow of the returns and exchange agent: customer surfaces feed a Claude Sonnet 4.6 agent whose tool loop is capped at eight turns, then a fast-path rule test and a Sonnet 4.6 supervisor audit produce a three-way verdict of PASS, REVISE or ESCALATE.">
<title>Returns and exchange agent — one customer turn, end to end</title>
<desc>A customer message arrives through the Flask UI or REPL and reaches the primary agent, a Claude Sonnet 4.6 call with composable skills. A tool_use decision sends it round a deterministic tool loop capped at eight turns; hitting the cap emits a canned handoff message that is not routed anywhere. The draft then meets a deterministic fast-path rule test: if a rule fires the reply is sent with no second model call, otherwise a Sonnet 4.6 supervisor audits it against policy and returns PASS, REVISE, which re-drafts once, or ESCALATE, which is terminal. The eval harness wraps the whole runtime and blocks nothing.</desc>

<defs>
<marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#475569"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#2f7a4f"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#b07414"/></marker>
<marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#7c8899"/></marker>
</defs>

<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

<rect x="0" y="0" width="900" height="1040" fill="#ffffff"/>

<!-- eval harness frame wrapping the runtime -->
<rect x="48" y="203" width="794" height="709" rx="14" fill="#f8f6fd" stroke="#6d5aa8" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="60" y="220" font-size="10" font-weight="700" fill="#6d5aa8" letter-spacing="0.8">EVAL HARNESS</text>
<text x="152" y="220" font-size="8.5" fill="#6d5aa8">drives scripted turns · scores actions + content + LLM judge (Sonnet 4.6) · pass^k · blocks nothing</text>

<!-- bands -->
<rect x="180" y="85" width="660" height="100" rx="10" fill="#eef2f6" stroke="#d6dde4"/>
<rect x="60" y="232" width="770" height="668" rx="10" fill="#eef2f6" stroke="#d6dde4"/>
<text x="194" y="105" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.8">CUSTOMER SURFACES</text>
<text x="74" y="252" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.8">AGENT RUNTIME</text>

<!-- customer -->
<rect x="40" y="115" width="110" height="42" rx="7" fill="#334155"/>
<text x="95" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Customer</text>

<!-- surfaces -->
<rect x="230" y="115" width="170" height="42" rx="6" fill="#2b6cb0"/>
<text x="315" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Flask chat UI</text>
<text x="315" y="147" text-anchor="middle" font-size="9" fill="#cfe0f0">app.py</text>
<rect x="440" y="115" width="150" height="42" rx="6" fill="#2b6cb0"/>
<text x="515" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">REPL</text>
<text x="515" y="147" text-anchor="middle" font-size="9" fill="#cfe0f0">chat.py</text>

<!-- agent -->
<rect x="330" y="268" width="210" height="105" rx="8" fill="#1f4e79"/>
<text x="435" y="285" text-anchor="middle" font-size="8" font-weight="700" fill="#7fc4ff" letter-spacing="1.1">MODEL CALL</text>
<text x="435" y="303" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Primary agent</text>
<text x="435" y="317" text-anchor="middle" font-size="8.5" fill="#bcd4e8">agent.py · Claude Sonnet 4.6</text>
<rect x="345" y="328" width="180" height="32" rx="5" fill="#2b6cb0"/>
<text x="435" y="348" text-anchor="middle" font-size="9" fill="#ffffff">skills/ — composable</text>

<!-- tool_use diamond -->
<polygon points="435,395 490,435 435,475 380,435" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="435" y="432" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">tool_use?</text>
<text x="435" y="445" text-anchor="middle" font-size="8" fill="#64748b">decision</text>

<!-- tools -->
<rect x="600" y="407" width="190" height="56" rx="6" fill="#2b6cb0"/>
<text x="695" y="423" text-anchor="middle" font-size="8" font-weight="700" fill="#cfe0f0" letter-spacing="1.1">DETERMINISTIC</text>
<text x="695" y="439" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Tools</text>
<text x="695" y="453" text-anchor="middle" font-size="8.5" fill="#cfe0f0">tools.py · identity + PII enforced here</text>

<!-- data -->
<rect x="600" y="493" width="190" height="28" rx="5" fill="#ffffff" stroke="#94a3b8"/>
<text x="695" y="511" text-anchor="middle" font-size="9" fill="#334155">data/inventory.json</text>
<rect x="600" y="527" width="190" height="28" rx="5" fill="#ffffff" stroke="#94a3b8"/>
<text x="695" y="545" text-anchor="middle" font-size="9" fill="#334155">data/orders.json</text>
<rect x="600" y="561" width="190" height="28" rx="5" fill="#ffffff" stroke="#94a3b8"/>
<text x="695" y="579" text-anchor="middle" font-size="9" fill="#334155">policy.yaml</text>

<!-- cap-hit node -->
<rect x="150" y="470" width="196" height="64" rx="6" fill="#fffaf2" stroke="#b07414" stroke-width="1.4"/>
<text x="248" y="487" text-anchor="middle" font-size="8" font-weight="700" fill="#b07414" letter-spacing="1.1">DETERMINISTIC</text>
<text x="248" y="503" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7a4e08">loop cap hit — 8 turns</text>
<text x="248" y="518" text-anchor="middle" font-size="8" fill="#7a4e08">canned &quot;hand you to a human&quot; text</text>
<text x="248" y="529" text-anchor="middle" font-size="8" font-weight="600" fill="#b07414">no queue routing</text>

<!-- fast path diamond -->
<polygon points="435,558 497,600 435,642 373,600" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="435" y="594" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b" letter-spacing="1">DETERMINISTIC</text>
<text x="435" y="606" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">fast-path rule</text>
<text x="435" y="617" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">fires?</text>

<!-- pass outcome -->
<rect x="600" y="572" width="220" height="56" rx="6" fill="#eaf4ee" stroke="#2f7a4f" stroke-width="1.4"/>
<text x="710" y="594" text-anchor="middle" font-size="10" font-weight="700" fill="#1f5c39">Supervised reply → customer</text>
<text x="710" y="611" text-anchor="middle" font-size="8" fill="#2f7a4f">the customer never sees a raw draft</text>

<!-- supervisor -->
<rect x="330" y="680" width="210" height="105" rx="8" fill="#1f4e79"/>
<text x="435" y="697" text-anchor="middle" font-size="8" font-weight="700" fill="#7fc4ff" letter-spacing="1.1">MODEL CALL</text>
<text x="435" y="715" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Supervisor audit</text>
<text x="435" y="729" text-anchor="middle" font-size="8.5" fill="#bcd4e8">supervisor.py · Claude Sonnet 4.6</text>
<rect x="345" y="740" width="180" height="32" rx="5" fill="#2b6cb0"/>
<text x="435" y="760" text-anchor="middle" font-size="9" fill="#ffffff">5 failure modes vs policy.yaml</text>

<!-- verdict diamond -->
<polygon points="435,807 492,845 435,883 378,845" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="435" y="843" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">verdict</text>
<text x="435" y="856" text-anchor="middle" font-size="7.5" fill="#64748b">3-way</text>

<!-- human queue -->
<rect x="330" y="940" width="210" height="62" rx="7" fill="#334155" stroke="#b07414" stroke-width="1.6"/>
<text x="435" y="962" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Human queue</text>
<text x="435" y="980" text-anchor="middle" font-size="8" font-weight="700" fill="#f0c890" letter-spacing="0.6">TERMINAL — AGENT NEVER RESUMES</text>

<!-- flows -->
