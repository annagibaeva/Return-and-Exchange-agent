<text x="244" y="838" text-anchor="middle" fill="#7c8899" font-weight="600">REVISE — re-draft once, then re-audit</text>
<text x="448" y="912" fill="#b07414" font-weight="700">ESCALATE</text>
<text x="576" y="488" text-anchor="end">reads</text>
